name: Feature request
description: Suggest an idea or a new provider
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The workflow or problem, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
  - type: checkboxes
    id: help
    attributes:
      label: Can you help?
      options:
        - label: I'm interested in sending a pull request for this
